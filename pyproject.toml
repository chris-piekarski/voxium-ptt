[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxium"
version = "0.0.2"
description = "Voxium — PTT vox-in local voice typing (radio + Apollo-stack tone; see docs/brand.md)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.4",
    "faster-whisper==1.2.1",
    "huggingface-hub>=0.21",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'win32'",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pyautogui>=0.9.53; sys_platform != 'linux'",
    # Phase 2 client-side /transcribe-stream WebSocket sender + receiver
    # (docs/plans/live-transcribe-stream.md). Required at runtime when
    # ``--stream-transcribe`` is enabled; the client falls back to no-live-text
    # if the import fails, but a missing dep is the most common cause of "I
    # turned streaming on and saw no live readback" — keep it as a runtime dep.
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3",
    "pylint>=3.2",
    "ruff>=0.4",
    "pytest>=7",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "httpx>=0.27",
    "py-spy>=0.4",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
voxium = "voxium.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["voxium*"]

[tool.ruff.lint.per-file-ignores]
"src/voxium/whisper_server.py" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "/(\\.venv.*|build|dist|htmlcov|\\.mypy_cache|\\.ruff_cache)/"

# Pylint: semantic / complexity checks Ruff does not own. Line length and import order are
# Black / Ruff; large entrypoints match mypy (ignored here for noise and scan time).
[tool.pylint.main]
py-version = "3.10"
jobs = 0
ignore = ["app.py", "whisper_server.py"]

[tool.pylint."messages control"]
disable = [
  "line-too-long",
  "too-many-lines",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "import-outside-toplevel",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-positional-arguments",
  "too-many-return-statements",
  "too-many-instance-attributes",
  "subprocess-run-check",
  "consider-using-f-string",
  "unused-argument",
  "broad-exception-caught",
  "protected-access",
  "use-implicit-booleaness-not-comparison",
  "global-statement",
  "invalid-name",
  "consider-using-from-import",
  "wrong-import-order",
  "unused-variable",
  "undefined-all-variable",
  "duplicate-code",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
# Only list top-level packages; subpackages like voxium.cli are part of voxium.
packages = ["voxium"]
ignore_missing_imports = true
exclude = [".venv", "build", "dist"]

# Large client/server modules are not fully annotated yet; keep mypy useful on
# `model_registry`, `config`, `cli`, and `__init__` without blocking the gate.
[[tool.mypy.overrides]]
module = "voxium.app"
ignore_errors = true

[[tool.mypy.overrides]]
module = "voxium.whisper_server"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: network, GPU, or real OS integration (opt-in)",
    "gpu: requires CUDA device or large models",
    "windows: only relevant on win32",
    "linux: only relevant on Linux",
    "darwin: only relevant on macOS",
]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/voxium"]
omit = [
    "tests/**",
    "*/site-packages/*",
    ".venv/**",
    "*/__pycache__/*",
    "*/voxium/__main__.py",
    # Heavy entrypoints: require sounddevice, ctranslate2, full stack to import; tested interactively.
    "*/voxium/app.py",
    "*/voxium/whisper_server.py",
    # Rich Live + PTT status box: mostly interactive; pure helpers are smoke-tested, not line-gated.
    "*/voxium/console_status.py",
]

[tool.coverage.report]
fail_under = 90.0
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

# Optional: `coverage html` (e.g. ad-hoc) would default to `htmlcov/` if you add a [tool.coverage.html] block.
