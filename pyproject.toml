[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxium"
version = "0.0.1"
description = "Voxium — PTT vox-in local voice typing (radio + Apollo-stack tone; see docs/brand.md)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.4",
    "faster-whisper==1.2.1",
    "huggingface-hub>=0.21",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'win32'",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pyautogui>=0.9.53; sys_platform != 'linux'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=7",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "httpx>=0.27",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
voxium = "voxium.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["voxium*"]

[tool.ruff.lint.per-file-ignores]
"src/voxium/whisper_server.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
packages = ["voxium", "voxium.cli"]
ignore_missing_imports = true
exclude = [".venv", "build", "dist"]

# Large client/server modules are not fully annotated yet; keep mypy useful on
# `model_registry`, `config`, `cli`, and `__init__` without blocking the gate.
[[tool.mypy.overrides]]
module = "voxium.app"
ignore_errors = true

[[tool.mypy.overrides]]
module = "voxium.whisper_server"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: network, GPU, or real OS integration (opt-in)",
    "gpu: requires CUDA device or large models",
    "windows: only relevant on win32",
    "linux: only relevant on Linux",
    "darwin: only relevant on macOS",
]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/voxium", "scripts"]
omit = [
    "tests/**",
    "*/site-packages/*",
    ".venv/**",
    "*/__pycache__/*",
    "*/voxium/__main__.py",
    # Heavy entrypoints: require sounddevice, ctranslate2, full stack to import; tested interactively.
    "*/voxium/app.py",
    "*/voxium/whisper_server.py",
    # Rich Live + PTT status box: mostly interactive; pure helpers are smoke-tested, not line-gated.
    "*/voxium/console_status.py",
]

[tool.coverage.report]
fail_under = 90.0
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

# Optional: `coverage html` (e.g. ad-hoc) would default to `htmlcov/` if you add a [tool.coverage.html] block.
